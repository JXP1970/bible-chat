<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiBel-Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --purple: #8b5cf6;
      --purple-dark: #6d28d9;
      --gray-dark: #1f2937;
      --gray-light: #f3f4f6;
      --white: #ffffff;
      --border: #e5e7eb;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--purple) 0%, var(--purple-dark) 100%);
      min-height: 100vh;
      padding: 10px;
    }
    .container {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 10px;
      max-width: 1400px;
      margin: 0 auto;
      height: 100vh;
    }
    .header {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, var(--purple) 0%, var(--purple-dark) 100%);
      color: white;
      padding: 15px 20px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .header h1 { font-size: 24px; font-weight: 600; }
    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .lang-toggle, .api-btn {
      background: rgba(255,255,255,0.2);
      border: 2px solid white;
      color: white;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .lang-toggle:hover, .api-btn:hover { background: rgba(255,255,255,0.3); }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: white;
      border-radius: 8px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .modal-content h2 { margin-top: 0; color: var(--purple); }
    .modal-content input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 14px;
      margin: 15px 0;
      box-sizing: border-box;
    }
    .modal-content button {
      background: var(--purple);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      margin-right: 10px;
    }
    .modal-content button:hover { background: var(--purple-dark); }
    .modal-content .cancel-btn {
      background: #6b7280;
    }
    .modal-content .cancel-btn:hover { background: #4b5563; }
    .sidebar {
      background: white;
      border-radius: 8px;
      padding: 15px;
      overflow-y: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .sidebar h2 {
      font-size: 14px;
      font-weight: 600;
      color: var(--purple);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .bible-reading-book { font-weight: 600; color: var(--purple); margin-bottom: 8px; }
    .bible-reading-verses { font-size: 12px; color: #6b7280; margin-bottom: 12px; }
    .bible-reading-text {
      font-size: 13px;
      line-height: 1.6;
      color: var(--gray-dark);
      padding: 10px;
      background: var(--gray-light);
      border-radius: 4px;
      max-height: 300px;
      overflow-y: auto;
    }
    .main {
      background: white;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message { display: flex; gap: 10px; animation: slideIn 0.3s ease-out; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.user { justify-content: flex-end; }
    .message-content {
      max-width: 70%;
      padding: 12px 15px;
      border-radius: 12px;
      word-wrap: break-word;
      line-height: 1.4;
    }
    .message.assistant .message-content {
      background: var(--gray-light);
      color: var(--gray-dark);
      border-bottom-left-radius: 4px;
    }
    .message.user .message-content {
      background: var(--purple);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .typing-indicator { display: flex; gap: 4px; padding: 12px 15px; background: var(--gray-light); border-radius: 12px; width: fit-content; }
    .typing-dot { width: 8px; height: 8px; background: #9ca3af; border-radius: 50%; animation: bounce 1.4s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-8px); } }
    .input-area {
      border-top: 1px solid var(--border);
      padding: 15px;
      background: var(--gray-light);
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .input-field {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      max-height: 100px;
      min-height: 40px;
    }
    .input-field:focus {
      outline: none;
      border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
    }
    .button-group { display: flex; gap: 8px; }
    button {
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 13px;
    }
    .btn-send { background: var(--purple); color: white; }
    .btn-send:hover { background: var(--purple-dark); }
    .btn-send:disabled { background: #ccc; cursor: not-allowed; }
    .btn-record { background: #ef4444; color: white; min-width: 50px; }
    .btn-record:hover { background: #dc2626; }
    .btn-record.recording { background: #fbbf24; color: black; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .message-content { max-width: 90%; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📖 BiBel-Chat</h1>
    <div class="header-actions">
      <button class="api-btn" id="apiBtn">🔑 API</button>
      <button class="lang-toggle" id="langToggle">English</button>
    </div>
  </div>
  <div class="modal" id="apiModal">
    <div class="modal-content">
      <h2>Claude API Key</h2>
      <p>Gib deinen Claude API Key ein (von <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a>):</p>
      <input type="password" id="apiKeyInput" placeholder="sk-ant-..." />
      <button onclick="saveApiKey()">Speichern</button>
      <button class="cancel-btn" onclick="closeApiModal()">Abbrechen</button>
    </div>
  </div>
  <div class="container">
    <div class="sidebar">
      <h2 id="readingLabel">Tageslesung</h2>
      <div class="bible-reading">
        <div class="bible-reading-book" id="readingBook">Laden...</div>
        <div class="bible-reading-verses" id="readingVerses"></div>
        <div class="bible-reading-text" id="readingText"></div>
      </div>
    </div>
    <div class="main">
      <div class="chat-box" id="chatBox"></div>
      <div class="input-area">
        <textarea class="input-field" id="messageInput" placeholder="Frag Claude etwas zur Lesung..." rows="2"></textarea>
        <div class="button-group">
          <button class="btn-record" id="recordBtn">🎤</button>
          <button class="btn-send" id="sendBtn">Senden</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    let messages = [];
    let isRecording = false;
    let language = 'de';
    let apiKey = localStorage.getItem('claudeApiKey') || '';
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    const synth = window.speechSynthesis;
    const chatBox = document.getElementById('chatBox');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const recordBtn = document.getElementById('recordBtn');
    const langToggle = document.getElementById('langToggle');
    const apiBtn = document.getElementById('apiBtn');
    const apiModal = document.getElementById('apiModal');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const i18n = {
      de: { readingLabel: 'Tageslesung', inputPlaceholder: 'Frag Claude etwas zur Lesung...' },
      en: { readingLabel: 'Daily Reading', inputPlaceholder: 'Ask Claude about the reading...' }
    };
    function t(key) { return i18n[language][key] || key; }
    function loadBibleReading() {
      const reading = {
        book: 'Philipper 4',
        chapter: '4',
        verses: '1-9',
        text: 'Darum, meine geliebten Brüder, seht euch danach, in dem Herrn auszuharren, meine Lieben!\n\nEulalia und Syntyche bitte ich, einig zu sein im Herrn...'
      };
      document.getElementById('readingBook').textContent = `${reading.book} ${reading.chapter}:${reading.verses}`;
      document.getElementById('readingVerses').textContent = `${reading.chapter}:${reading.verses}`;
      document.getElementById('readingText').textContent = reading.text;
    }
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    recordBtn.addEventListener('click', toggleRecording);
    langToggle.addEventListener('click', toggleLanguage);
    apiBtn.addEventListener('click', () => {
      apiKeyInput.value = apiKey;
      apiModal.classList.add('active');
    });
    recognition.onstart = () => { isRecording = true; recordBtn.classList.add('recording'); recordBtn.textContent = '⏹️'; };
    recognition.onresult = (event) => { messageInput.value = Array.from(event.results).map(r => r[0].transcript).join(''); };
    recognition.onend = () => { isRecording = false; recordBtn.classList.remove('recording'); recordBtn.textContent = '🎤'; };
    function toggleRecording() {
      if (isRecording) recognition.stop();
      else { recognition.lang = language === 'de' ? 'de-DE' : 'en-US'; recognition.start(); }
    }
    function toggleLanguage() {
      language = language === 'de' ? 'en' : 'de';
      langToggle.textContent = language === 'de' ? 'English' : 'Deutsch';
      messageInput.placeholder = t('inputPlaceholder');
      document.getElementById('readingLabel').textContent = t('readingLabel');
    }
    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;
      if (!apiKey) { alert('Bitte gib zuerst dein API Key ein! (🔑 API Button)'); return; }
      messages.push({ role: 'user', content: text });
      addMessageToChat('user', text);
      messageInput.value = '';
      const thinkingId = 'thinking-' + Date.now();
      addThinkingIndicator(thinkingId);
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system: `Du bist ein erfahrener Bibellehrer. Sprache: ${language === 'de' ? 'Deutsch' : 'English'}.`,
            messages,
            apiKey
          })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'API Error');
        const assistantMessage = data.content || data.message || 'Keine Antwort';
        document.getElementById(thinkingId)?.remove();
        messages.push({ role: 'assistant', content: assistantMessage });
        addMessageToChat('assistant', assistantMessage);
        if (synth && assistantMessage) speakText(assistantMessage);
      } catch (error) {
        document.getElementById(thinkingId)?.remove();
        addMessageToChat('assistant', `Fehler: ${error.message}`);
      }
    }
    function addMessageToChat(role, content) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${role}`;
      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';
      contentDiv.textContent = content;
      messageDiv.appendChild(contentDiv);
      chatBox.appendChild(messageDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
    function addThinkingIndicator(id) {
      const div = document.createElement('div');
      div.id = id;
      div.className = 'message assistant';
      div.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
    function speakText(text) {
      if (synth.speaking) synth.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = language === 'de' ? 'de-DE' : 'en-US';
      utterance.rate = 0.9;
      synth.speak(utterance);
    }
    loadBibleReading();
    function saveApiKey() {
      const newApiKey = apiKeyInput.value.trim();
      if (!newApiKey) { alert('API Key darf nicht leer sein!'); return; }
      apiKey = newApiKey;
      localStorage.setItem('claudeApiKey', apiKey);
      closeApiModal();
      alert('API Key gespeichert!');
    }
    function closeApiModal() {
      apiModal.classList.remove('active');
      apiKeyInput.value = '';
    }
    if (!API_KEY) console.warn('API Key fehlt! In Console: localStorage.setItem("claudeApiKey", "sk-ant-...")');
  </script>
</body>
</html>
